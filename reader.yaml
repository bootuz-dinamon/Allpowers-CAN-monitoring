# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: rs485can
  friendly_name: RS485CAN

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
      
logger:
  level: DEBUG
  

api:
  encryption:
    key: ""

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: RS485CAN Fallback Hotspot
    password: ""

captive_portal:




#web_server:
#  port: 80                # http://<ip>/ - зручно дивитись лог і останній кадр з телефону

substitutions:
  can_tx_pin: "GPIO27"           # <-- ваш пін CTX
  can_rx_pin: "GPIO26"           # <-- ваш пін CRX
  bms_bitrate: "125KBPS"
 
 

canbus:
  - platform: esp32_can
    id: bms_can
    tx_pin: ${can_tx_pin}
    rx_pin: ${can_rx_pin}
    can_id: 0
    bit_rate: ${bms_bitrate}
    # Справжній апаратний listen-only: не виставляє ACK і не генерує
    # error frames навіть при збоях синхронізації — безпечно для BMS.
    mode: LISTENONLY
    on_frame:
      - can_id: 0x1F800021
        use_extended_id: true
        then:
          - lambda: |-
              uint8_t page = x[0];
              if (page == 0x00 && x.size() >= 6) {
                id(battery_soc).publish_state((float) x[1]);
                id(battery_temperature).publish_state((float) x[5]);
              }
              if (page == 0x01 && x.size() >= 6) {
                float voltage = ((uint16_t)(x[2] << 8 | x[3])) * 0.1f;
                float current = ((int16_t)(x[4] << 8 | x[5])) * 0.1f;
                id(battery_voltage).publish_state(voltage);
                id(battery_current).publish_state(current);
              }
 
 
sensor:
  - platform: template
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
 
  - platform: template
    name: "Battery Current"
    id: battery_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
 
  - platform: template
    name: "Battery SOC"
    id: battery_soc
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
 
  - platform: template
    name: "Battery Temperature"
    id: battery_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
 
 
 
  # Розрахункова потужність (напруга * струм), додатне = заряд,
  # від'ємне = розряд. Оновлюється щоразу коли приходить нова напруга
  # або струм (page 0x01), тому інтервал невеликий і безпечний.
  - platform: template
    name: "Battery Power"
    id: battery_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (id(battery_voltage).has_state() && id(battery_current).has_state()) {
        return id(battery_voltage).state * id(battery_current).state;
      } else {
        return {};
      }
